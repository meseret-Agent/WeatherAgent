name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 4 hours to keep the app active
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep_awake:
    runs-on: ubuntu-latest
    steps:
      - name: Lightweight HTTP GET Ping
        continue-on-error: true
        run: |
          echo "Sending HTTP GET ping with full browser headers..."
          curl -s -L --max-redirs 5 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          https://weerwijs.streamlit.app > /dev/null || true

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright Dependencies
        if: always()
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Headless Browser Session (Playwright Wake-Up)
        if: always()
        run: |
          python -c '
          import time
          from playwright.sync_api import sync_playwright

          url = "https://weerwijs.streamlit.app"
          print(f"Launching headless browser and navigating to {url}...")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              )
              page = context.new_page()
              try:
                  response = page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  print("Page loaded. HTTP Status:", response.status if response else "Unknown")
                  time.sleep(5)
                  
                  # Check if Streamlit sleep wake-up button is present
                  wake_buttons = page.query_selector_all("button")
                  clicked = False
                  for btn in wake_buttons:
                      btn_text = btn.inner_text().strip().lower()
                      if "wake" in btn_text or "get this app back up" in btn_text:
                          print(f"Detected wake-up button (\"{btn.inner_text()}\"). Clicking to wake up app...")
                          btn.click()
                          clicked = True
                          time.sleep(10)
                          break
                  
                  if not clicked:
                      print("App is active (no sleep button found). Page title:", page.title())
              except Exception as e:
                  print("Playwright check finished:", e)
              finally:
                  browser.close()
          '
